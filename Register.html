
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Registration</title>

    <link rel="stylesheet" href="Register.css">
</head>

<body>

<div class="register-container">

    <main class="registration-main">

        <form id="residentSignupForm">

            <div class="form-layout">

                <!-- PERSONAL INFORMATION -->
                <section class="form-card personal-card">

                    <h2>Personal Info</h2>

                    <div class="grid-2">

                        <div class="field-group">
                            <label for="firstName">First Name *</label>
                            <input
                                type="text"
                                id="firstName"
                                placeholder="Enter first name"
                                required
                            >
                        </div>

                        <div class="field-group">
                            <label for="lastName">Last Name *</label>
                            <input
                                type="text"
                                id="lastName"
                                placeholder="Enter last name"
                                required
                            >
                        </div>

                        <div class="field-group">
                            <label for="contact">Contact *</label>
                            <input
                                type="text"
                                id="contact"
                                maxlength="10"
                                placeholder="e.g. 0821234567"
                                required
                            >
                        </div>

                        <div class="field-group">
                            <label for="email">Email *</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter email address"
                                required
                            >
                        </div>

                        <div class="field-group">
                            <label for="genderId">Gender *</label>
                            <select id="genderId" required>
                                <option value="">Select Gender</option>
                                <option value="1">Male</option>
                                <option value="2">Female</option>
                                <option value="3">Other</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="dob">Date of Birth *</label>
                            <input
                                type="date"
                                id="dob"
                                required
                            >
                        </div>

                    </div>

                    <div class="field-group id-field">
                        <label for="idNumber">ID No. *</label>
                        <input
                            type="text"
                            id="idNumber"
                            maxlength="13"
                            inputmode="numeric"
                            placeholder="Enter 13-digit ID"
                            required
                        >
                    </div>

                </section>


                <!-- PROPERTY AND LOCATION INFORMATION -->
                <section class="form-card property-card">

                    <h2>Property Info</h2>

                    <div class="field-group">
                        <label for="provinceId">Select Province *</label>
                        <select id="provinceId" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>

                    <div class="grid-2">

                        <div class="field-group">
                            <label for="cityId">Select City *</label>
                            <select id="cityId" required>
                                <option value="">Select City</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="villageId">Select Village *</label>
                            <select id="villageId" required>
                                <option value="">Select Village</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="houseNo">House No. *</label>
                            <input
                                type="text"
                                id="houseNo"
                                placeholder="Enter house number"
                                required
                            >
                        </div>

                        <div class="field-group">
                            <label for="plotNo">Plot No. *</label>
                            <input
                                type="text"
                                id="plotNo"
                                placeholder="e.g. LP-000"
                                required
                            >
                        </div>

                    </div>

                    <div class="field-group">
                        <label for="landSize">Land Size (m²) *</label>
                        <input
                            type="number"
                            id="landSize"
                            min="0.01"
                            step="0.01"
                            placeholder="Enter land size"
                            required
                        >
                    </div>

                    <div class="field-group location-description">
                        <label for="locationDesc">
                            Location Description *
                        </label>
                        <textarea
                            id="locationDesc"
                            placeholder="Describe the property location"
                            required
                        ></textarea>
                    </div>

                </section>


                <!-- ACCOUNT INFORMATION -->
                <section class="form-card account-card">

                    <h2>Account Info</h2>

                    <div class="account-fields">

                        <div class="grid-2">

                            <div class="field-group">
                                <label for="username">Username *</label>
                                <input
                                    type="text"
                                    id="username"
                                    placeholder="Create username"
                                    required
                                >
                            </div>

                            <div class="field-group">
                                <label for="password">Password *</label>
                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Create password"
                                    required
                                >
                            </div>

                            <div class="field-group">
                                <label for="relationshipId">
                                    Relationship *
                                </label>
                                <select id="relationshipId" required>
                                    <option value="1" selected>Head</option>
                                </select>
                            </div>

                            <div class="field-group">
                                <label for="confirmPassword">
                                    Confirm Password *
                                </label>
                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm password"
                                    required
                                >
                            </div>

                        </div>

                    </div>

                </section>

            </div>


            <!-- ACTION BUTTONS -->
            <div class="button-area">

                <button type="submit" id="registerBtn">
                    Register Household
                </button>

                <a href="login.html" id="cancelBtn">
                    Cancel
                </a>

            </div>

        </form>

    </main>

</div>

<script src="Register.js"></script>

</body>
</html>
