<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Village Statistics</title>

    <link rel="stylesheet"
          href="Statistics.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="page-container">

        <div class="topbar">

            <h2>
                Village Statistics
            </h2>

        </div>

        <section class="stats-grid">

            <div class="stat-card">
                <h4>Total Residents</h4>
                <h2 id="totalResidents">0</h2>
            </div>

            <div class="stat-card">
                <h4>Total Households</h4>
                <h2 id="totalHouseholds">0</h2>
            </div>

            <div class="stat-card">
                <h4>Total Relocated</h4>
                <h2 id="totalRelocated">0</h2>
            </div>

            <div class="stat-card">
                <h4>Total Deceased</h4>
                <h2 id="totalDeceased">0</h2>
            </div>

            <div class="stat-card">
                <h4>Total Funerals</h4>
                <h2 id="totalFunerals">0</h2>
            </div>

            <div class="stat-card">
                <h4>Total Marriages</h4>
                <h2 id="totalMarriages">0</h2>
            </div>

        </section>

        <section class="charts-grid">

            <div class="chart-card">

                <h3>
                    Gender Distribution
                </h3>

                <canvas id="genderChart"></canvas>

            </div>

            <div class="chart-card">

                <h3>
                    Age Distribution
                </h3>

                <canvas id="ageChart"></canvas>

            </div>

        </section>

    </div>

    <script src="Statistics.js"></script>

</body>

</html>
