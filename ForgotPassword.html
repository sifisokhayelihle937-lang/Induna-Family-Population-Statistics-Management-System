<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password
    </title>

     <link rel="stylesheet" href="ForgotPassword.css">

</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <h1>

                Forgot Password

            </h1>

            <p>

                Verify your account details before resetting your password.

            </p>

            <!-- ===================================== -->
            <!-- VERIFY ACCOUNT -->
            <!-- ===================================== -->

            <div
                id="verificationSection">

                <div class="form-group">

                    <label>

                        Username

                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username">

                </div>

                <div class="form-group">

                    <label>

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address">

                </div>

                <button
                    type="button"
                    id="verifyBtn">

                    Verify Account

                </button>

            </div>

            <!-- ===================================== -->
            <!-- RESET PASSWORD -->
            <!-- ===================================== -->

            <div
                id="resetSection"
                class="hidden">

                <div class="success-message">

                    ✓ Account Verified

                </div>

                <div class="form-group">

                    <label>

                        New Password

                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password">

                </div>

                <div class="form-group">

                    <label>

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password">

                </div>

                <button
                    type="button"
                    id="resetBtn">

                    Reset Password

                </button>

            </div>

            <!-- ===================================== -->
            <!-- BACK TO LOGIN -->
            <!-- ===================================== -->

            <div class="footer-links">

                <a href="login.html">

                    Back To Login

                </a>

            </div>

        </div>

    </div>

    <script src="ForgotPassword.js"></script>

</body>

</html>
