<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Member Management</title>

    <link rel="stylesheet" href="Members.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="page-container">

    <main class="members-content">

        <!-- HEADER -->

        <div class="topbar">

            <div>

                <h2>Family Member Management</h2>

                <p id="householdInfo">
                    Household Members
                </p>

            </div>

            <button
                type="button"
                id="showAddMemberBtn"
                class="primary-btn">

                <i class="fas fa-plus"></i>
                Add Family Member

            </button>

        </div>

        <!-- ADD MEMBER SECTION -->

        <section
            class="content-panel"
            id="addMemberPanel">

            <div class="panel-header">

                <h2>
                    Add Family Member
                </h2>

            </div>

            <form id="memberForm">

                <h3 class="section-title">
                    Personal Information
                </h3>

                <div class="grid-2">

                    <div class="field-group">

                        <label>
                            First Name *
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            required>

                    </div>

                    <div class="field-group">

                        <label>
                            Last Name *
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            required>

                    </div>

                </div>

                <div class="grid-2">

                    <div class="field-group">

                        <label>
                            ID Number *
                        </label>

                        <input
                            type="text"
                            id="idNumber"
                            maxlength="13"
                            required>

                    </div>

                    <div class="field-group">

                        <label>
                            Contact Number
                        </label>

                        <input
                            type="text"
                            id="contact">

                    </div>

                </div>

                <div class="grid-2">

                    <div class="field-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="emailAddress">

                    </div>

                    <div class="field-group">

                        <label>
                            Date Of Birth *
                        </label>

                        <input
                            type="date"
                            id="dateOfBirth"
                            required>

                    </div>

                </div>

                <div class="grid-2">

                    <div class="field-group">

                        <label>
                            Gender *
                        </label>

                        <select
                            id="genderId"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="1">
                                Male
                            </option>

                            <option value="2">
                                Female
                            </option>

                            <option value="3">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="field-group">

                        <label>
                            Relationship *
                        </label>

                        <select
                            id="relationshipId"
                            required>

                            <option value="">
                                Select Relationship
                            </option>

                            <option value="2">Wife</option>
                            <option value="3">Husband</option>
                            <option value="4">Son</option>
                            <option value="5">Daughter</option>
                            <option value="6">Brother</option>
                            <option value="7">Sister</option>
                            <option value="8">Grandparent</option>
                            <option value="9">Grandchild</option>
                            <option value="10">Cousin</option>
                            <option value="11">Uncle</option>
                            <option value="12">Aunt</option>
                            <option value="13">Nephew</option>
                            <option value="14">Niece</option>
                            <option value="15">Father</option>
                            <option value="16">Mother</option>

                        </select>

                    </div>

                </div>

                <div class="button-area">

                    <button
                        type="submit"
                        id="saveMemberBtn">

                        Save Member

                    </button>

                </div>

            </form>

        </section>

        <!-- MEMBERS TABLE -->

        <section class="content-panel">

            <div class="panel-header">

                <h2>
                    Family Members List
                </h2>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Full Name
                            </th>

                            <th>
                                Relationship
                            </th>

                            <th>
                                Contact
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Date Joined
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="membersTableBody">

                        <tr>

                            <td colspan="6">
                                No family members found.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <!-- UPDATE STATUS MODAL -->

        <div
            class="modal"
            id="statusModal">

            <div class="modal-content">

                <h2>
                    Update Family Member Status
                </h2>

                <input
                    type="hidden"
                    id="residentId">

                <div class="field-group">

                    <label>
                        Status
                    </label>

                    <select id="rstatusId">

                        <option value="1">
                            Alive
                        </option>

                        <option value="21">
                            Deceased
                        </option>

                        <option value="41">
                            Relocated
                        </option>

                    </select>

                </div>

                <!-- RELOCATION -->

                <div
                    class="field-group"
                    id="relocationGroup">

                    <label>
                        Relocation Destination
                    </label>

                    <input
                        type="text"
                        id="relocationDestination">

                </div>

                <!-- DATE LEFT -->

                <div
                    class="field-group"
                    id="dateLeftGroup">

                    <label>
                        Date Left / Date Of Death
                    </label>

                    <input
                        type="date"
                        id="dateLeft">

                </div>

                <div class="button-area">

                    <button
                        type="button"
                        id="updateStatusBtn">

                        Update Status

                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="Members.js"></script>

</body>
</html>
