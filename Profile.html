<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="Profile.css">

</head>

<body>

    <div class="page-container">

        <div class="profile-card">

            <h1>
                My Profile
            </h1>

            <!-- ================================ -->
            <!-- PERSONAL INFORMATION -->
            <!-- ================================ -->

            <h2>
                Personal Information
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName">

                </div>

                <div class="form-group">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName">

                </div>

                <div class="form-group">

                    <label>
                        ID Number
                    </label>

                    <input
                        type="text"
                        id="idNumber"
                        readonly>

                </div>

                <div class="form-group">

                    <label>
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="contactNumber">

                </div>

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="emailAddress">

                </div>

                <div class="form-group">

                    <label>
                        Date Of Birth
                    </label>

                    <input
                        type="text"
                        id="dateOfBirth"
                        readonly>

                </div>

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        readonly>

                </div>

                <div class="form-group">

                    <label>
                        Role
                    </label>

                    <input
                        type="text"
                        id="roleName"
                        readonly>

                </div>

                <!-- INDUNA ONLY -->

                <div
                    class="form-group hidden"
                    id="traditionalNameSection">

                    <label>
                        Traditional Name
                    </label>

                    <input
                        type="text"
                        id="traditionalName"
                        readonly>

                </div>

                <!-- INDUNA & ADMIN -->

                <div
                    class="form-group hidden"
                    id="villageSection">

                    <label>
                        Village
                    </label>

                    <input
                        type="text"
                        id="villageName"
                        readonly>

                </div>

            </div>

            <button
                id="saveProfileBtn">

                Save Changes

            </button>

            <!-- ================================ -->
            <!-- CHANGE PASSWORD -->
            <!-- ================================ -->

            <div class="password-section">

                <h2>
                    Change Password
                </h2>

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword">

                </div>

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword">

                </div>

                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword">

                </div>

                <button
                    id="changePasswordBtn">

                    Change Password

                </button>

            </div>

        </div>

    </div>

    <script src="Profile.js"></script>

</body>

</html>
